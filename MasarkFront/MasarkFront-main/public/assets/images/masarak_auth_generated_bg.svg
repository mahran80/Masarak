<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="40%" stop-color="#1E3A8A"/>
      <stop offset="80%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <!-- Glowing Blobs -->
    <radialGradient id="glow-blue" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-emerald" cx="80%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-purple" cx="85%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <!-- Book Gradient -->
    <linearGradient id="book-cover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="book-pages" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1920" height="1080" fill="url(#bg-grad)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="300" cy="250" r="600" fill="url(#glow-blue)"/>
  <circle cx="1600" cy="850" r="650" fill="url(#glow-emerald)"/>
  <circle cx="1650" cy="200" r="550" fill="url(#glow-purple)"/>

  <!-- Subtle Educational Grid Pattern Overlay -->
  <g opacity="0.07" stroke="#FFFFFF" stroke-width="1">
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60"/>
    </pattern>
    <rect width="1920" height="1080" fill="url(#grid)"/>
  </g>

  <!-- Dynamic Curved Educational Path ("Masarak") -->
  <path d="M -100 850 C 400 950, 700 650, 1100 750 C 1500 850, 1800 500, 2020 400" 
        fill="none" stroke="rgba(96, 165, 250, 0.25)" stroke-width="4" stroke-dasharray="12 12"/>
  <path d="M -100 830 C 400 930, 700 630, 1100 730 C 1500 830, 1800 480, 2020 380" 
        fill="none" stroke="rgba(16, 185, 129, 0.3)" stroke-width="2"/>

  <!-- FLOATING 3D EDUCATIONAL ILLUSTRATIONS -->

  <!-- Left Bottom: Glowing Open Book Stack -->
  <g transform="translate(180, 720) scale(1.4)" opacity="0.85">
    <!-- Base Book -->
    <path d="M 0 60 L 120 10 L 240 60 L 120 110 Z" fill="url(#book-cover)" opacity="0.8"/>
    <path d="M 0 60 L 0 75 L 120 125 L 120 110 Z" fill="#1D4ED8"/>
    <path d="M 240 60 L 240 75 L 120 125 L 120 110 Z" fill="#1E40AF"/>

    <!-- Open Floating Book -->
    <g transform="translate(20, -70)">
      <path d="M 0 30 Q 50 10 100 35 Q 150 10 200 30 L 200 80 Q 150 60 100 80 Q 50 60 0 80 Z" fill="url(#book-pages)"/>
      <path d="M 100 35 L 100 80" stroke="#94A3B8" stroke-width="2"/>
      <!-- Glowing Page Lines -->
      <line x1="25" y1="45" x2="80" y2="52" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
      <line x1="25" y1="58" x2="75" y2="65" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
      <line x1="120" y1="52" x2="175" y2="45" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
      <line x1="125" y1="65" x2="175" y2="58" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Top Right: Floating Graduation Cap -->
  <g transform="translate(1620, 180) scale(1.2)" opacity="0.8">
    <polygon points="80,10 160,50 80,90 0,50" fill="#3B82F6"/>
    <polygon points="80,10 160,50 80,90 0,50" fill="none" stroke="#60A5FA" stroke-width="3"/>
    <path d="M35,68 L35,100 C35,115 125,115 125,100 L125,68" fill="#1E40AF" opacity="0.9"/>
    <!-- Tassel -->
    <path d="M160,50 L175,90 L175,120" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    <circle cx="175" cy="122" r="5" fill="#F59E0B"/>
  </g>

  <!-- Floating Sparkles and Trophy Icons -->
  <g transform="translate(320, 220)" fill="#F59E0B" opacity="0.75">
    <path d="M0,15 L6,6 L15,0 L6,-6 L0,-15 L-6,-6 L-15,0 L-6,6 Z"/>
  </g>
  <g transform="translate(1480, 750) scale(0.8)" fill="#34D399" opacity="0.75">
    <path d="M0,20 L8,8 L20,0 L8,-8 L0,-20 L-8,-8 L-20,0 L-8,8 Z"/>
  </g>
  <g transform="translate(1720, 520) scale(0.6)" fill="#60A5FA" opacity="0.8">
    <path d="M0,20 L8,8 L20,0 L8,-8 L0,-20 L-8,-8 L-20,0 L-8,8 Z"/>
  </g>

  <!-- Floating Glowing Light Orbs -->
  <circle cx="280" cy="480" r="8" fill="#60A5FA" opacity="0.6"/>
  <circle cx="1540" cy="380" r="12" fill="#34D399" opacity="0.5"/>
  <circle cx="1420" cy="220" r="6" fill="#FBBF24" opacity="0.7"/>
</svg>
