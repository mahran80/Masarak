<section class="student-page student-schedule-page p-6 bg-slate-50 min-h-screen text-slate-900" dir="rtl">
  <header class="mb-8">
    <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
      <div>
        <p class="text-sm font-semibold text-[#4F8CD4]">الجدول الدراسي</p>
        <h1 class="mt-1 text-2xl font-bold text-slate-950 sm:text-3xl">حصص صفي</h1>
      </div>
      
      <div class="flex items-center gap-4 bg-white rounded-xl shadow-sm border border-slate-100 p-1.5">
        <select
          [ngModel]="selectedWeek()"
          (change)="onWeekChange($event)"
          class="bg-transparent text-sm font-bold text-slate-700 min-w-[140px] text-center focus:outline-none cursor-pointer px-2 py-1"
          dir="rtl"
        >
          @for (week of academicWeeks(); track week.value) {
            <option [value]="week.value">{{ week.label }}</option>
          }
        </select>
      </div>

      <button
        type="button"
        class="inline-flex min-h-11 items-center justify-center rounded-xl bg-[#4F8CD4] px-6 text-sm font-bold text-white transition hover:bg-[#3d6ca3] shadow-sm disabled:cursor-not-allowed disabled:opacity-60"
        [disabled]="isLoading()"
        (click)="loadSchedule()"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ml-2" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd" />
        </svg>
        تحديث
      </button>
    </div>
  </header>

  @if (isLoading()) {
    <div class="grid grid-cols-7 gap-4">
      @for (item of [1, 2, 3, 4, 5, 6, 7]; track item) {
        <div class="h-[500px] animate-pulse rounded-xl bg-white shadow-sm"></div>
      }
    </div>
  } @else if (errorMessage()) {
    <div class="p-6 bg-white rounded-2xl shadow-sm border border-slate-100">
      <div class="rounded-xl border border-rose-200 bg-rose-50 p-6 text-center">
        <p class="text-sm font-bold text-rose-700">عذرًا، لم نتمكن من تحميل الجدول</p>
        <p class="mt-2 text-sm text-slate-600">{{ errorMessage() }}</p>
        <button type="button" class="mt-4 rounded-lg bg-rose-600 px-6 py-2.5 text-sm font-bold text-white shadow-sm" (click)="loadSchedule()">
          إعادة المحاولة
        </button>
      </div>
    </div>
  } @else {
    <app-weekly-calendar 
      [weekStart]="weekStart()" 
      [sessions]="calendarSessions()" 
      role="student"
      (join)="joinSessionFromCalendar($event)"
    ></app-weekly-calendar>
  }
</section>
