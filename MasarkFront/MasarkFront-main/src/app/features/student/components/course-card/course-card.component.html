<article class="course-card-premium" 
         [style.--subject-color]="themeColor().hex"
         [style.--subject-color-light]="themeColor().hex + '15'"
         [class.course-card-premium--selected]="selected()" 
         dir="rtl">
  
  <!-- Top Accent Strip -->
  <div class="card-accent-strip"></div>
  
  <!-- Glowing border on hover -->
  <div class="card-glow-accent"></div>

  <!-- Large 3D Illustration -->
  <div class="card-illustration-container">
    <img [src]="imageUrl()" [alt]="course().subjectArabicName || course().subjectName" class="card-illustration-img">
  </div>

  <!-- Content details -->
  <div class="card-details">
    <div class="flex items-center justify-between gap-2 mb-2.5">
      <span class="subject-badge">{{ course().gradeName || 'الصف الرابع' }}</span>
      <span class="activity-badge">
        <span class="pulse-dot"></span>
        {{ lastActivity() }}
      </span>
    </div>

    <h3 class="subject-name-ar">{{ course().subjectArabicName || course().subjectName }}</h3>
    <p class="subject-name-en">{{ course().subjectName }}</p>

    <!-- Meta Information -->
    <div class="meta-info-grid mt-4.5">
      <div class="meta-item">
        <app-icon name="document-text" [size]="16" class="text-slate-400/80 shrink-0"></app-icon>
        <span class="meta-text"><b>{{ lessonsCount() }}</b> درس</span>
      </div>
      <div class="meta-item">
        <app-icon name="clipboard-document-list" [size]="16" class="text-slate-400/80 shrink-0"></app-icon>
        <span class="meta-text"><b>{{ assignmentsCount() }}</b> واجبات</span>
      </div>
    </div>
  </div>

  <!-- CTA action -->
  <div class="card-footer mt-auto pt-4.5">
    <button type="button" (click)="viewDetails.emit(course())" class="card-cta-btn">
      <span>ابدأ التعلم</span>
      <span class="arrow-icon">←</span>
    </button>
  </div>
</article>
