<article
  class="flex h-full flex-col rounded-lg border bg-white p-5 text-right shadow-sm transition hover:-translate-y-0.5 hover:shadow-md"
  [class.border-sky-300]="selected()"
  [class.ring-2]="selected()"
  [class.ring-sky-100]="selected()"
  [class.border-slate-200]="!selected()"
  dir="rtl"
>
  <div class="flex items-start justify-between gap-3">
    <div class="min-w-0">
      <h3 class="truncate text-lg font-bold text-slate-950">{{ course().subjectName }}</h3>
    </div>
    <span class="rounded-full bg-slate-100 px-3 py-1 text-xs font-semibold text-slate-600">
      مقرر
    </span>
  </div>

  @if (course().description) {
    <p class="mt-4 line-clamp-3 text-sm leading-6 text-slate-600">{{ course().description }}</p>
  } @else {
    <div class="mt-4 flex flex-col items-center justify-center rounded-xl border border-blue-100 bg-blue-50/50 p-6 text-center text-sm text-slate-500" dir="ltr">
      <svg class="mx-auto mb-2 h-8 w-8 text-slate-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 0 0 6 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 0 1 6 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 0 1 6-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0 0 18 18a8.967 8.967 0 0 0-6 2.292m0-14.25v14.25" />
      </svg>
      لم تُضف أي وصف للمقرّر بعد.
    </div>
  }

  <dl class="mt-5 grid gap-2 text-sm">
    @if (course().teacherName) {
      <div class="flex items-center justify-between gap-3 rounded-lg bg-slate-50 px-3 py-2">
        <dt class="font-semibold text-slate-500">المعلم</dt>
        <dd class="truncate font-semibold text-slate-800">{{ course().teacherName }}</dd>
      </div>
    }
    @if (course().gradeName) {
      <div class="flex items-center justify-between gap-3 rounded-lg bg-slate-50 px-3 py-2">
        <dt class="font-semibold text-slate-500">الصف</dt>
        <dd class="truncate font-semibold text-slate-800">{{ course().gradeName }}</dd>
      </div>
    }
  </dl>

  <button
    type="button"
    class="mt-auto inline-flex min-h-10 items-center justify-center rounded-xl bg-blue-600 px-6 text-sm font-semibold text-white shadow-sm transition-all duration-300 hover:bg-blue-700 hover:shadow-md hover:-translate-y-0.5 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
    (click)="viewDetails.emit(course())"
  >
    عرض التفاصيل
  </button>
</article>
