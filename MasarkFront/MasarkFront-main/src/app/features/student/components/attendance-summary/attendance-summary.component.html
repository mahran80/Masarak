<article class="rounded-[18px] border border-slate-200/80 dark:border-slate-800 bg-white dark:bg-slate-800/90 p-6 text-right shadow-[0_4px_20px_rgba(15,23,42,0.02)] hover:-translate-y-1 hover:shadow-[0_12px_30px_rgba(15,23,42,0.06)] transition-all duration-300 relative overflow-hidden h-full" dir="rtl">
  <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between mb-4">
    <div>
      <p class="text-xs font-black uppercase tracking-wide text-slate-400 dark:text-slate-500">ملخّص الحضور</p>
      <h2 class="mt-2 text-3xl font-black text-slate-800 dark:text-white">{{ attendanceRate() }}%</h2>
    </div>
    <span class="inline-flex items-center rounded-full bg-slate-50 dark:bg-slate-700/60 border border-slate-150 dark:border-slate-700 px-4 py-1.5 text-xs font-black text-slate-600 dark:text-slate-300 shadow-sm">
      {{ totalSessions() }} جلسات إجمالاً
    </span>
  </div>

  <div class="h-2 w-full overflow-hidden rounded-full bg-slate-100 dark:bg-slate-700 mb-6">
    <div
      class="h-full rounded-full bg-gradient-to-r from-emerald-400 to-emerald-600 transition-all duration-700 ease-out"
      [style.width.%]="attendanceRate()"
    ></div>
  </div>

  @if (summary(); as data) {
    <dl class="grid gap-3 grid-cols-2 lg:grid-cols-4">
      <div class="rounded-2xl bg-emerald-50/40 dark:bg-emerald-950/20 border border-emerald-100 dark:border-emerald-800/40 p-3.5 text-center">
        <dt class="text-[11px] font-black uppercase tracking-wide text-emerald-600 dark:text-emerald-400 mb-1">حاضر</dt>
        <dd class="text-2xl font-black text-emerald-700 dark:text-emerald-300">{{ data.presentCount }}</dd>
      </div>
      <div class="rounded-2xl bg-rose-50/40 dark:bg-rose-950/20 border border-rose-100 dark:border-rose-800/40 p-3.5 text-center">
        <dt class="text-[11px] font-black uppercase tracking-wide text-rose-600 dark:text-rose-400 mb-1">غائب</dt>
        <dd class="text-2xl font-black text-rose-700 dark:text-rose-300">{{ data.absentCount }}</dd>
      </div>
      <div class="rounded-2xl bg-amber-50/40 dark:bg-amber-950/20 border border-amber-100 dark:border-amber-800/40 p-3.5 text-center">
        <dt class="text-[11px] font-black uppercase tracking-wide text-amber-600 dark:text-amber-400 mb-1">متأخّر</dt>
        <dd class="text-2xl font-black text-amber-700 dark:text-amber-300">{{ data.lateCount ?? 0 }}</dd>
      </div>
      <div class="rounded-2xl bg-blue-50/40 dark:bg-blue-950/20 border border-blue-100 dark:border-blue-800/40 p-3.5 text-center">
        <dt class="text-[11px] font-black uppercase tracking-wide text-blue-600 dark:text-blue-400 mb-1">مُعذَر</dt>
        <dd class="text-2xl font-black text-blue-700 dark:text-blue-300">{{ data.excusedCount ?? 0 }}</dd>
      </div>
    </dl>
  } @else {
    <div class="flex flex-col items-center justify-center rounded-2xl border border-blue-100 dark:border-blue-900/40 bg-blue-50/20 dark:bg-blue-950/20 p-6 text-center text-xs text-slate-500 dark:text-slate-400" dir="ltr">
      <svg class="mx-auto mb-2 h-8 w-8 text-slate-400 dark:text-slate-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 0 1 3 19.875v-6.75ZM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V8.625ZM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V4.125Z" />
      </svg>
      لا تتوفّر بيانات حضور.
    </div>
  }
  <div class="absolute bottom-0 left-0 right-0 h-[3px] bg-gradient-to-r from-emerald-500 to-teal-500"></div>
</article>
