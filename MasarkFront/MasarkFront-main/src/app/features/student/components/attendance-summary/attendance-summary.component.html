<article class="rounded-xl border border-slate-200 bg-white p-5 text-right shadow-sm" dir="rtl">
  <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
    <div>
      <p class="text-xs font-bold uppercase tracking-wide text-slate-400">ملخّص الحضور</p>
      <h2 class="mt-2 text-3xl font-bold text-slate-950">{{ attendanceRate() }}%</h2>
    </div>
    <span class="inline-flex items-center rounded-full bg-slate-100 px-4 py-1.5 text-sm font-bold text-slate-700 ring-1 ring-slate-200 shadow-sm">
      {{ totalSessions() }} جلسات
    </span>
  </div>

  <div class="mt-5 h-2.5 w-full overflow-hidden rounded-full bg-[#f1f5f9]">
    <div
      class="h-full rounded-full bg-gradient-to-r from-blue-400 to-blue-600 transition-all duration-700 ease-out"
      [style.width.%]="attendanceRate()"
    ></div>
  </div>

  @if (summary(); as data) {
    <dl class="mt-5 grid gap-3 sm:grid-cols-4">
      <div class="rounded-xl bg-white border border-blue-100 shadow-sm p-4">
        <dt class="text-xs font-bold uppercase tracking-wide text-slate-400">حاضر</dt>
        <dd class="mt-1 text-2xl font-bold text-blue-800">{{ data.presentCount }}</dd>
      </div>
      <div class="rounded-xl bg-white border border-blue-100 shadow-sm p-4">
        <dt class="text-xs font-bold uppercase tracking-wide text-slate-400">غائب</dt>
        <dd class="mt-1 text-2xl font-bold text-blue-800">{{ data.absentCount }}</dd>
      </div>
      <div class="rounded-xl bg-white border border-blue-100 shadow-sm p-4">
        <dt class="text-xs font-bold uppercase tracking-wide text-slate-400">متأخّر</dt>
        <dd class="mt-1 text-2xl font-bold text-blue-800">{{ data.lateCount ?? 0 }}</dd>
      </div>
      <div class="rounded-xl bg-white border border-blue-100 shadow-sm p-4">
        <dt class="text-xs font-bold uppercase tracking-wide text-slate-400">مُعذَر</dt>
        <dd class="mt-1 text-2xl font-bold text-blue-800">{{ data.excusedCount ?? 0 }}</dd>
      </div>
    </dl>
  } @else {
    <div class="mt-5 flex flex-col items-center justify-center rounded-xl border border-blue-100 bg-blue-50/50 p-6 text-center text-sm text-slate-500" dir="ltr">
      <svg class="mx-auto mb-2 h-8 w-8 text-slate-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 0 1 3 19.875v-6.75ZM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V8.625ZM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V4.125Z" />
      </svg>
      لا تتوفّر بيانات حضور.
    </div>
  }
</article>
