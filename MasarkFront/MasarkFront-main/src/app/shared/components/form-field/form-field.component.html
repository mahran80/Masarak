<div class="mb-4">
  <label [for]="fieldId" class="block text-sm font-semibold text-slate-700 mb-1.5">
    {{ label }}
    <span *ngIf="required" class="text-red-500 mr-0.5">*</span>
  </label>
  <ng-content></ng-content>
  <p *ngIf="hint && !errorMessage" class="text-xs text-slate-400 mt-1">{{ hint }}</p>
  <small
    *ngIf="errorMessage"
    [id]="fieldId + '-error'"
    role="alert"
    class="text-red-500 text-xs mt-1 block font-medium"
  >
    {{ errorMessage }}
  </small>
</div>
