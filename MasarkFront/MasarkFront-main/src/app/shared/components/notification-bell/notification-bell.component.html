<div class="relative">
  <button type="button" class="w-10 h-10 rounded-full flex items-center justify-center text-slate-500 hover:text-blue-600 hover:bg-slate-100 transition-colors focus:outline-none" (click)="togglePanel()">
    <app-icon name="bell" [size]="22"></app-icon>
    <span class="absolute top-0 right-0 min-w-[18px] h-[18px] px-1 rounded-full bg-blue-600 text-white text-[10px] font-bold flex items-center justify-center border-2 border-white" *ngIf="notificationService.unreadCount() > 0">
      {{ notificationService.unreadCount() > 9 ? '9+' : notificationService.unreadCount() }}
    </span>
  </button>

  <app-notification-panel
    *ngIf="isOpen()"
    (close)="closePanel()">
  </app-notification-panel>
</div>
