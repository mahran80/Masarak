<div class="fixed inset-0 z-40" (click)="onBackdropClick()"></div>

<div class="absolute top-full left-0 mt-2 w-80 bg-white border border-slate-200 rounded-xl shadow-lg z-50 overflow-hidden" dir="rtl">
  
  <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between bg-white">
    <h4 class="font-bold text-slate-900 text-sm">الإشعارات</h4>
    <button type="button" class="text-xs font-semibold text-blue-600 hover:text-blue-700 transition-colors focus:outline-none" (click)="onMarkAllRead()">
      تحديد الكل كمقروء
    </button>
  </div>

  <div class="max-h-[60vh] overflow-y-auto bg-white">
    <div
      *ngFor="let n of notificationService.notifications()"
      (click)="onMarkRead(n)"
      class="p-5 border-b border-slate-50 cursor-pointer transition-colors hover:bg-slate-50"
      [class.bg-blue-50]="!n.isRead"
      [class.bg-white]="n.isRead">
      
      <div class="flex flex-col gap-1.5 relative">
        <h6 class="font-semibold text-sm text-slate-900 leading-tight" [class.pr-3]="!n.isRead">
          <span *ngIf="!n.isRead" class="absolute right-0 top-1.5 w-1.5 h-1.5 rounded-full bg-blue-600"></span>
          {{ n.title }}
        </h6>
        <p class="text-xs text-slate-600 leading-relaxed">{{ n.body }}</p>
        <span class="text-[11px] font-medium text-slate-400 mt-1">{{ notificationService.timeAgo(n.createdAt) }}</span>
      </div>
      
    </div>

    <div *ngIf="notificationService.notifications().length === 0" class="p-8 text-center text-sm text-slate-500 font-medium">
      لا توجد إشعارات حاليًا.
    </div>
  </div>

  <div class="px-5 py-3 border-t border-slate-100 bg-slate-50 text-center">
    <a href="javascript:void(0)" class="text-xs font-bold text-slate-600 hover:text-blue-600 transition-colors" (click)="onBackdropClick()">
      عرض كل الإشعارات
    </a>
  </div>
</div>
