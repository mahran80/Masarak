<div
  *ngIf="dialogService.currentDialog() as dialog"
  class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-xs transition-opacity duration-200"
  (click)="onBackdropClick($event)"
  dir="rtl"
>
  <div
    cdkTrapFocus
    [cdkTrapFocusAutoCapture]="true"
    role="alertdialog"
    aria-modal="true"
    aria-labelledby="confirm-dialog-title"
    aria-describedby="confirm-dialog-desc"
    class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden transform transition-all duration-200 p-6 border border-slate-100"
    (click)="$event.stopPropagation()"
  >
    <!-- Dialog Header -->
    <div class="flex items-start gap-4 mb-4">
      <div [ngClass]="{
        'bg-red-50 text-red-600': dialog.variant === 'danger',
        'bg-amber-50 text-amber-600': dialog.variant === 'warning',
        'bg-blue-50 text-blue-600': dialog.variant === 'default'
      }" class="w-12 h-12 rounded-xl flex items-center justify-center shrink-0">
        <svg *ngIf="dialog.variant === 'danger'" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
        <svg *ngIf="dialog.variant === 'warning'" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
        <svg *ngIf="dialog.variant === 'default'" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>

      <div class="flex-1">
        <h2 id="confirm-dialog-title" class="text-lg font-bold text-slate-800">{{ dialog.title }}</h2>
        <p id="confirm-dialog-desc" class="text-sm text-slate-600 mt-1 leading-relaxed">{{ dialog.body }}</p>
        <p *ngIf="dialog.detail" class="text-xs text-slate-400 mt-2 bg-slate-50 p-2.5 rounded-lg border border-slate-100">{{ dialog.detail }}</p>
      </div>
    </div>

    <!-- Actions -->
    <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-100 mt-6">
      <button
        type="button"
        (click)="onCancel()"
        class="px-5 py-2.5 rounded-xl text-sm font-semibold text-slate-700 bg-white border border-slate-300 hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-400 focus:ring-offset-2 transition-colors"
      >
        {{ dialog.cancelLabel }}
      </button>

      <button
        type="button"
        (click)="onConfirm()"
        [ngClass]="{
          'bg-red-600 hover:bg-red-700 text-white focus:ring-red-500 shadow-sm shadow-red-200': dialog.variant === 'danger',
          'bg-amber-600 hover:bg-amber-700 text-white focus:ring-amber-500 shadow-sm shadow-amber-200': dialog.variant === 'warning',
          'bg-blue-600 hover:bg-blue-700 text-white focus:ring-blue-500 shadow-sm shadow-blue-200': dialog.variant === 'default'
        }"
        class="px-5 py-2.5 rounded-xl text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-offset-2 transition-colors"
      >
        {{ dialog.confirmLabel }}
      </button>
    </div>
  </div>
</div>
